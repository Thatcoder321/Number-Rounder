<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Number Rounder</title>
  <link rel="stylesheet" href="styles/main.css" />
  <nav style="position: absolute; top: 1rem; right: 1rem;">
    <a href="index.html" style="margin-right: 1rem;">Rounder</a>
    <a href="cosine.html">Trig Tools</a>
  </nav>
</head>
<body>
    <div class="container">
        <h1>🔢 Number Rounder</h1>
        <div class="input-section>">
            <label for="number-input">Enter a number:</label>
            <input type="number" id="number-input" placeholder="e.g. 123.456" />
        </div>

        <div class="round-options">
            <label for="round-type">Round to:</label>
<select id="round-type">
  <option value="decimal-1">Nearest Tenth (1 decimal)</option>
  <option value="decimal-2">Nearest Hundredth (2 decimals)</option>
  <option value="decimal-3">Nearest Thousandth (3 decimals)</option>

            </select>
        </div>
        <button id="round-btn">Round It!</button>

        <div class="result-box">
            <h2>Rounded Result:</h2>
            <p id="result">-</p>
            <p id="explanation-toggle" style="color: #007aff; cursor: pointer; display: none;">See explanation</p>
            <p id="explanation-text" style="display: none; margin-top: 0.5rem;"></p>
        </div>
    </div>

    <script src="js/main.js" defer></script>
    <script src="js/chatbot.js" defer></script>
    <!-- Chatbot UI -->
<div id="chatbot-toggle" style="position: fixed; bottom: 20px; right: 20px; background-color: #007aff; color: white; border-radius: 50%; width: 50px; height: 50px; font-size: 28px; text-align: center; line-height: 50px; cursor: pointer; z-index: 999;">💬</div>

<div id="chatbot-box" style="position: fixed; bottom: 80px; right: 20px; width: 300px; background-color: #1e1e1e; color: white; padding: 1rem; border-radius: 8px; display: none; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.4); z-index: 999;">
  <div id="chat-messages" style="height: 200px; overflow-y: auto; margin-bottom: 0.5rem;"></div>
  <input id="chat-input" placeholder="Ask anything..." style="padding: 0.5rem; width: 100%; border: none; border-radius: 4px; margin-bottom: 0.5rem; background-color: #2c2c2c; color: white;" />
  <button id="chat-send" style="padding: 0.5rem; background-color: #007aff; color: white; border: none; border-radius: 4px; cursor: pointer;">Send</button>
</div>
<div id="made-by" style="position: fixed; bottom: 10px; left: 10px; font-size: 0.9rem; color: #90caf9; opacity: 0.8; z-index: 999;">
  Made by Nethul 🚀
</div>
    </body>
    </html>
